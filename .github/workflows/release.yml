name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on:
      group: m7b-squid
      labels: m7b-macos-arm64
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load release secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2
        with:
          export-env: true
          version: 2.39.0
        env:
          OP_CONNECT_HOST: https://vault.m7b.io
          OP_CONNECT_TOKEN: ${{ secrets.VAULT_OVERSEER_RELEASE }}
          MACOS_NOTARY_ISSUER_ID: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/55920b96f36b46346238a5c4
          MACOS_NOTARY_KEY: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/17d20708816ffca9a49c0264
          MACOS_NOTARY_KEY_ID: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/a51ddac6cefce03cd8e437af
          MACOS_SIGN_P12: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/xnvhe5mawjt3cvqibum3cv6zga
          MACOS_SIGN_PASSWORD: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/c0669fbb8623da8f934a2477

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ".release/go.mod"
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
